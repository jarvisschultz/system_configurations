[color]
	ui = auto
[push]
	default = simple
[core]
	excludesfile = ~/.gitignore
[credential]
	helper = cache --timeout=300
[filter "lfs"]
	clean = git-lfs clean -- %f
	smudge = git-lfs smudge -- %f
	required = true
[diff "gpg"]
	textconv = gpg --no-tty --decrypt
[alias]
	it = !git init && git commit -m “root” --allow-empty
	st = status --short --branch
	grog = log --graph --abbrev-commit --decorate --all --format=format:\"%C(bold blue)%h%C(reset) - %C(bold cyan)%aD%C(dim white) - %an%C(reset) %C(bold green)(%ar)%C(reset)%C(bold yellow)%d%C(reset)%n %C(white)%s%C(reset)\"
	stu = status --ignore-submodules=all
	# list orphaned branches (upstream gone), with the worktree holding each, if any
	borph = "!git for-each-ref --format='%(if:equals=[gone])%(upstream:track)%(then)%(refname:short)%09%(worktreepath)%(end)' refs/heads | sed '/^$/d'"
	# delete orphaned branches not checked out in any worktree (see git wtclean for those)
	bdorph = "!git for-each-ref --format='%(if:equals=[gone])%(upstream:track)%(then)%(if)%(worktreepath)%(then)%(else)%(refname:short)%(end)%(end)' refs/heads | sed '/^$/d' | xargs -r git branch -D"
